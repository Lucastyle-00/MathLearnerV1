{% extends 'base.html' %}

{% block content %}

<h1>Math Learner App</h1>
<h1>Select a Class</h1>
<div class="class-list">    
    {% for class in classes %}
    <a href="{{ url_for('classlist', classid=class['ClassID']) }}" class="general-button">
        {{ class['ClassName'] }}
    </a>
    {% endfor %}
</div>
{% endblock %}
